# Production setup for one server (see deploy/LIGHTSAIL.md):
#   docker compose up -d --build
# Settings come from .env next to this file (OPENAI_API_KEY, PDD_DOMAIN, PDD_* options).
services:
  app:
    build: .
    env_file: .env
    environment:
      PDD_DATA_DIR: /data
      PDD_COOKIE_SECURE: "true"   # Caddy serves the site over HTTPS only
    volumes:
      - pidi-data:/data           # database, uploaded recordings, documents, secret key
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PDD_DOMAIN: ${PDD_DOMAIN:?Set PDD_DOMAIN in .env to the site's domain, e.g. pidi.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data          # HTTPS certificates
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pidi-data:
  caddy-data:
  caddy-config:
